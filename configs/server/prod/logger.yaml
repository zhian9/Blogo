# Blogo — 生产环境日志配置
logger:
  debug: false
  level: "info"
  console: true
  caller_skip: 1

  # 主日志（全量业务日志）
  file:
    enable: true
    path: "/app/logs/server/app.log"
    max_size: 128
    max_backups: 90
    max_age: 30
    compress: true

  # HTTP 访问日志（tag=request）
  access_log:
    enable: true
    path: "/app/logs/server/access.log"
    max_size: 128
    max_backups: 30
    max_age: 30
    compress: true

  # 错误日志（level >= error）
  error_log:
    enable: true
    path: "/app/logs/server/error.log"
    max_size: 64
    max_backups: 30
    max_age: 30
    compress: true

  # 后台审计日志（tag=audit）
  audit_log:
    enable: true
    path: "/app/logs/audit/admin.log"
    max_size: 128
    max_backups: 90
    max_age: 90
    compress: true

  # 安全事件日志（tag=security）
  security_log:
    enable: true
    path: "/app/logs/audit/security.log"
    max_size: 64
    max_backups: 90
    max_age: 180
    compress: true

  hooks:
    - enable: true
      level: "error"
      type: "gorm"
      max_buffer: 1024
      max_thread: 4
      options:
        debug: "false"
        db_type: "mysql"
        dsn: "${DB_DSN}"
        max_open_conn: "16"
        max_idle_conn: "4"
        max_life_time: "86400"
        max_idle_time: "7200"
