# Blogo — 生产环境中间件配置
middleware:
  cors:
    enable: true
    allow_origins:
      - "${CORS_ALLOW_ORIGINS}"
    allow_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "PATCH"
      - "DELETE"
      - "HEAD"
      - "OPTIONS"
    allow_headers:
      - "Content-Type"
      - "Authorization"
      - "X-Request-Id"
      - "X-Trace-Id"
    max_age: 86400
    allow_wildcard: false
    allow_web_sockets: true
    allow_files: true

  recovery:
    skip: 3

  trace:
    request_header_key: "X-Request-Id"
    response_trace_key: "X-Trace-Id"

  logger:
    max_output_request_body_len: 4096
    max_output_response_body_len: 4096

  copy_body:
    max_content_len: 134217728

  auth:
    disable: false
    skipped_path_prefixes:
      - "/api/v1/captcha"
      - "/api/v1/login"
      - "/api/v1/register"
      - "/api/v1/verify-email"
      - "/api/v1/archives"
      - "/api/v1/articles"
      - "/api/v1/article"
      - "/api/v1/subscribe"
      - "/api/v1/favorites"     # 收藏（自助）
      - "/api/v1/users/"        # 关注/粉丝（自助）
      - "/api/v1/notifications" # 通知（自助）
      - "/api/v1/settings/all"  # 公共设置
      - "/api/v1/tags/all"      # 公共标签
      - "/api/v1/categories/all" # 公共分类
    # 注意：不要再把 "/api/v1/images/" 加进来。
    # 图片的公开读取接口（GET /api/v1/images/category/:category 与
    # GET /api/v1/images/:id/file）已经注册在 blog.RegisterV1PublicRouters，
    # 本身不经过 Auth/Casbin；而这里放行的是整个前缀，会让
    # POST /images/upload、PUT|DELETE /images/{id}、DELETE /images/batch-delete
    # 一起变成匿名可调用（可被未授权删改图片、匿名上传）。
    signing_method: "HS512"
    signing_key: "${JWT_SIGNING_KEY}"
    old_signing_key: ""
    expired: 86400
    store:
      type: "redis"
      delimiter: ":"
      memory:
        cleanup_interval: 60
      badger:
        path: "data/auth"
      redis:
        addr: ""
        username: ""
        password: ""
        db: 2

  rate_limiter:
    enable: true
    period: 10
    max_requests_per_ip: 300
    max_requests_per_user: 150
    store:
      type: "redis"
      memory:
        expiration: 3600
        cleanup_interval: 60
      redis:
        addr: ""
        username: ""
        password: ""
        db: 10

  casbin:
    disable: false
    skipped_path_prefixes:
      - "/api/v1/captcha"
      - "/api/v1/login"
      - "/api/v1/register"
      - "/api/v1/verify-email"
      - "/api/v1/current/"
      - "/api/v1/archives"
      - "/api/v1/articles"
      - "/api/v1/article"
      - "/api/v1/subscribe"
      - "/api/v1/favorites"     # 收藏（自助）
      - "/api/v1/users/"        # 关注/粉丝（自助）
      - "/api/v1/notifications" # 通知（自助）
      - "/api/v1/images/upload" # 图片上传（自助：普通用户传头像/封面）
      - "/api/v1/settings/all"  # 公共设置
      - "/api/v1/tags/all"      # 公共标签
      - "/api/v1/categories/all" # 公共分类
    # 同上：图片的公开读取已在公开路由组注册。
    # 这里只放行「上传」这一条自助路由，不能放行整个 "/api/v1/images/" 前缀，
    # 否则 GET|PUT|DELETE /images/{id} 与 DELETE /images/batch-delete 会绕过 RBAC，
    # 任何登录用户都能删改全站图片记录。
    load_thread: 2
    auto_load_interval: 3
    model_file: "rbac_model.conf"
    gen_policy_file: "gen_rbac_policy.csv"
