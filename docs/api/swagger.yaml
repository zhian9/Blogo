paths:
  /api/v1/archives:
    get:
      description: Get article archive grouped by year and month
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseResult'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/schema.ArchiveItem'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ResponseResult'
      summary: Get article archive (public)
      tags:
      - ArticleAPI
  /api/v1/articles:
    get:
      parameters:
      - default: 1
        description: pagination index
        in: query
        name: current
        type: integer
      - default: 10
        description: pagination size
        in: query
        name: pageSize
        type: integer
      - description: Article title (fuzzy)
        in: query
        name: title
        type: string
      - description: Category ID
        in: query
        name: category_id
        type: string
      - description: Status (draft/published)
        enum:
        - draft
        - published
        in: query
        name: status
        type: string
      - description: Is top
        in: query
        name: is_top
        type: boolean
      - description: Published at >= (YYYY-MM-DD)
        in: query
        name: published_at_gte
        type: string
      - description: Published at <= (YYYY-MM-DD)
        in: query
        name: published_at_lte
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseResult'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/schema.Article'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ResponseResult'
      security:
      - BearerAuth: []
      summary: Query article list
      tags:
      - ArticleAPI
    post:
      parameters:
      - description: Article form
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/schema.ArticleForm'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseResult'
            - properties:
                data:
                  $ref: '#/definitions/schema.Article'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ResponseResult'
      security:
      - BearerAuth: []
      summary: Create article
      tags:
      - ArticleAPI
  /api/v1/articles/{id}:
    delete:
      parameters:
      - description: Article ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ResponseResult'
      security:
      - BearerAuth: []
      summary: Delete article by ID
      tags:
      - ArticleAPI
    get:
      parameters:
      - description: Article ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseResult'
            - properties:
                data:
                  $ref: '#/definitions/schema.Article'
