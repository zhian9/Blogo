          description: Bad Request
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ResponseResult'
      summary: Create comment (public)
      tags:
      - CommentAPI
  /api/v1/articles/{id}/top:
    patch:
      parameters:
      - description: Article ID
        in: path
        name: id
        required: true
        type: string
      - description: is_top flag
        in: body
        name: body
        required: true
        schema:
          properties:
            is_top:
              type: boolean
          type: object
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ResponseResult'
      security:
      - BearerAuth: []
      summary: Toggle article top status
      tags:
      - ArticleAPI
  /api/v1/articles/{id}/views:
    post:
      description: Atomic increment article views by ID
      parameters:
      - description: Article ID
        in: path
        name: id
        required: true
        type: string
      - default: 1
        description: Increment number
        in: query
        name: num
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ResponseResult'
      summary: Increment article views (public)
      tags:
      - ArticleAPI
  /api/v1/articles/slug/{slug}:
    get:
      description: Get article by slug, only published articles are accessible
      parameters:
      - description: Article slug
        in: path
        name: slug
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseResult'
            - properties:
                data:
                  $ref: '#/definitions/schema.Article'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ResponseResult'
      summary: Get published article by slug (public)
      tags:
      - ArticleAPI
  /api/v1/articles/status:
    patch:
      parameters:
      - description: IDs and status
