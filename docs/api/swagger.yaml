basePath: /
definitions:
  github_com_zhian9_blogo-server_pkg_errors.Error:
    properties:
      code:
        description: HTTP 状态码
        type: integer
      detail:
        description: 详细描述
        type: string
      id:
        description: 错误标识（前端友好）
        type: string
      status:
        description: 状态文本（如 "Not Found"）
        type: string
    type: object
  schema.ArchiveItem:
    properties:
      count:
        description: 该月文章数量
        type: integer
      month:
        description: 月份
        type: integer
      year:
        description: 年份
        type: integer
    type: object
  schema.Article:
    properties:
      author:
        allOf:
        - $ref: '#/definitions/schema.User'
        description: 作者信息（手动加载）
      author_id:
        description: 作者用户ID
        type: string
      category:
        allOf:
        - $ref: '#/definitions/schema.Category'
        description: 关联分类
      category_id:
        description: 分类ID
        type: string
      content:
        description: Markdown 原文
        type: string
      cover_image:
        allOf:
        - $ref: '#/definitions/schema.Image'
        description: 封面图（手动加载）
      cover_image_id:
        description: 封面图ID
        type: string
      created_at:
        description: 创建时间
        type: string
      html_content:
        description: 预渲染 HTML
        type: string
      id:
        description: 唯一ID
        type: string
      is_top:
        description: 是否置顶
        type: boolean
      published_at:
        description: 发布时间
        type: string
      seo_desc:
        description: SEO描述
        type: string
      seo_keywords:
        description: SEO关键词
        type: string
      seo_title:
        description: SEO标题
        type: string
      slug:
        description: SEO友好URL路径
        type: string
      status:
        description: 状态：draft / published
        type: string
      summary:
        description: 摘要
        type: string
      tags:
        description: 标签（多对多）
        items:
          $ref: '#/definitions/schema.Tag'
        type: array
      title:
        description: 文章标题
        type: string
      updated_at:
        description: 更新时间
        type: string
      views:
        description: 浏览量
        type: integer
      visibility:
        description: 可见性：public / private
        type: string
      visible_users:
        description: 可见用户列表（手动加载）
        items:
          $ref: '#/definitions/schema.ArticleVisibleUser'
        type: array
    type: object
  schema.ArticleForm:
    properties:
      category_id:
        description: 分类ID/名称（发布时自动创建）
        type: string
      content:
        description: Markdown内容
        type: string
      cover_image:
        allOf:
        - $ref: '#/definitions/schema.Image'
        description: 封面图
      cover_image_id:
        description: 封面图ID
        type: string
      is_top:
        description: 是否置顶
        type: boolean
      published_at:
        description: 发布时间
        type: string
      seo_desc:
        description: SEO描述
        maxLength: 1000
        type: string
      seo_keywords:
        description: SEO关键词
        maxLength: 512
        type: string
      seo_title:
        description: SEO标题
        maxLength: 255
        type: string
      slug:
        description: URL路径
        maxLength: 255
        type: string
      status:
        description: 状态
        enum:
        - draft
        - published
        type: string
      summary:
        description: 摘要
        maxLength: 1000
        type: string
      tag_ids:
        description: 标签ID/名称列表（发布时自动创建）
        items:
          type: string
        type: array
      title:
        description: 标题
        maxLength: 255
        type: string
      visibility:
        description: 可见性
        enum:
        - public
        - private
        - partial_visible
        type: string
      visible_user_ids:
        description: 可见用户ID列表（仅 partial_visible 时使用）
        items:
          type: string
        type: array
    required:
    - content
    - slug
    - status
    - title
    type: object
  schema.ArticleVisibleUser:
    properties:
      article_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      user_id:
        type: string
    type: object
  schema.BatchIDsForm:
    properties:
      ids:
        items:
          type: string
        type: array
    type: object
  schema.BatchUpdateStatusForm:
    properties:
      ids:
        items:
          type: string
        type: array
      status:
        description: draft | published
        type: string
    type: object
  schema.Captcha:
    properties:
      captcha_id:
        description: |-
          CaptchaID: 验证码唯一标识（用于后续验证）
          前端需在登录时提交此 ID + 用户输入的验证码
        example: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
        type: string
    type: object
  schema.Category:
    properties:
      article_count:
        description: 文章数量（非DB字段，查询时填充）
        type: integer
      created_at:
        description: 创建时间
        type: string
      id:
        description: 唯一ID
        type: string
      name:
        description: 分类名称（唯一）
        type: string
      sort:
        description: 排序值（越小越靠前）
        type: integer
      updated_at:
        description: 更新时间
        type: string
    type: object
  schema.CategoryForm:
    properties:
      name:
        description: 分类名称
        maxLength: 100
        type: string
      sort:
        description: 排序值
        minimum: 0
        type: integer
    required:
    - name
    type: object
  schema.Comment:
    properties:
      article:
        allOf:
        - $ref: '#/definitions/schema.Article'
        description: 所属文章
      article_id:
        description: 关联文章ID
        type: string
      content:
        description: 评论内容
        type: string
      created_at:
        description: 创建时间
        type: string
      email:
        description: 评论者邮箱（用于通知，可选）
        type: string
      id:
        description: 评论唯一ID
        type: string
      ip:
        description: 评论者IP（IPv4/IPv6）
        type: string
      is_top:
        description: 是否置顶（管理员可置顶优质评论）
        type: boolean
      moderation_message:
        description: 审核提示
        type: string
      parent:
        allOf:
        - $ref: '#/definitions/schema.Comment'
        description: 父评论
      parent_id:
        description: 父评论ID（用于回复评论，实现嵌套）
        type: string
      status:
        description: 评论状态（pending→审核后approved/rejected）
        type: string
      updated_at:
        description: 更新时间
        type: string
      user:
        allOf:
        - $ref: '#/definitions/schema.User'
        description: 关联字段（全部手动加载，避免外键约束）
      user_agent:
        description: 浏览器UA
        type: string
      user_id:
        description: 评论者ID（可为空，支持游客评论）
        type: string
      username:
        description: 评论者名称（若为游客，则存储输入的名称）
        type: string
    type: object
  schema.CommentForm:
    properties:
      article_id:
        description: 文章ID
        type: string
      content:
        description: 评论内容
        maxLength: 2000
        type: string
      email:
        description: 邮箱（可选，但若填则需合法）
        type: string
      parent_id:
        description: 父评论ID（可选）
        type: string
      user_id:
        description: 已登录用户ID（由 token 解析，前端不应传）
        type: string
      username:
        description: 游客需填名称
        type: string
    required:
    - article_id
    - content
    type: object
  schema.FriendLink:
    properties:
      created_at:
        description: 创建时间
        type: string
      description:
        description: 站点描述
        type: string
      email:
        description: 联系邮箱（用于审核沟通）
        type: string
      id:
        description: 友链唯一ID
        type: string
      logo:
        description: Logo图片URL（可关联 Image 表）
        type: string
      name:
        description: 站点名称
        type: string
      sort:
        description: 排序值（越小越靠前）
        type: integer
      status:
        description: 状态：enabled / disabled
        type: string
      updated_at:
        description: 更新时间
        type: string
      url:
        description: 站点链接
        type: string
    type: object
  schema.FriendLinkForm:
    properties:
      description:
        description: 描述
        maxLength: 255
        type: string
      email:
        description: 联系邮箱
        maxLength: 128
        type: string
      logo:
        description: Logo图片URL
        maxLength: 512
        type: string
      name:
        description: 站点名称
        maxLength: 100
        type: string
      sort:
        description: 排序值
        minimum: 0
        type: integer
      status:
        description: 状态
        enum:
        - enabled
        - disabled
        type: string
      url:
        description: 站点链接
        type: string
    required:
    - name
    - status
    - url
    type: object
  schema.Image:
    properties:
      category:
        description: 分类（如 "article_cover", "ad_image", "friend_link_logo"）
        type: string
      created_at:
        description: 上传时间
        type: string
      height:
        description: 图片高度（像素）
        type: integer
      id:
        description: 图片唯一ID
        type: string
      name:
        description: 原始文件名（如 architecture-diagram.png）
        type: string
      path:
        description: 存储路径（如 /uploads/2025/10/xxx.png）
        type: string
      size:
        description: 文件大小（字节）
        type: integer
      type:
        description: MIME 类型（如 image/png）
        type: string
      updated_at:
        description: 更新时间
        type: string
      url:
        description: 图片访问URL（如 https://cdn.example.com/xxx.png）
        type: string
      width:
        description: 图片宽度（像素）
        type: integer
    type: object
  schema.ImageForm:
    properties:
      category:
        description: 分类
        type: string
      height:
        description: 高度
        minimum: 0
        type: integer
      name:
        description: 原始文件名
        maxLength: 255
        type: string
      path:
        description: 存储路径
        type: string
      size:
        description: 文件大小
        minimum: 1
        type: integer
      type:
        description: MIME类型
        type: string
      url:
        description: 图片URL
        type: string
      width:
        description: 宽度
        minimum: 0
        type: integer
    required:
    - category
    - name
    - path
    - size
    - type
    - url
    type: object
  schema.Logger:
    properties:
      created_at:
        description: 创建时间（索引，用于时间范围查询）
        type: string
      data:
        description: 其他结构化字段的 JSON 序列化结果（TEXT 类型）
        type: string
      id:
        description: 唯一 ID（主键，20 字符）
        type: string
      level:
        description: 日志级别（索引，便于查询）
        type: string
      login_name:
        description: |-
          LoginName: 关联用户的登录名（来自 User.Username）
          gorm:"<-:false" 表示禁止写入数据库
          gorm:"-:migration" 表示迁移时忽略此字段
        type: string
      message:
        description: 日志主消息（最多 1024 字符）
        type: string
      stack:
        description: 错误堆栈（TEXT 类型，存储长文本）
        type: string
      tag:
        description: 日志分类标签（索引，如 "login", "system"）
        type: string
      trace_id:
        description: 链路追踪 ID（索引，用于排查问题）
        type: string
      user_id:
        description: 操作用户 ID（索引，用于审计）
        type: string
      user_name:
        description: 'UserName: 关联用户的真实姓名（来自 User.Name）'
        type: string
    type: object
  schema.LoginForm:
    properties:
      captcha_code:
        description: |-
          CaptchaCode: 用户输入的验证码（必填）
          前端从验证码图片中识别的字符
          Example: aB3x9
        example: aB3x9
        type: string
      captcha_id:
        description: |-
          CaptchaID: 验证码 ID（必填）
          来自 Captcha 接口的 captcha_id
          Example: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
        example: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
        type: string
      password:
        description: |-
          Password: 登录密码（必填）
          Example: goadmin123456
        example: goadmin123456
        type: string
      username:
        description: |-
          Username: 登录用户名（必填）
          Example: admin
        example: admin
        type: string
    required:
    - captcha_code
    - captcha_id
    - password
    - username
    type: object
  schema.LoginToken:
    properties:
      access_token:
        description: |-
          AccessToken: 访问令牌（JWT 字符串）
          前端需在后续请求的 Authorization 头中携带
          Example: eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9.xxxxx
        example: eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9.xxxxx
        type: string
      expires_at:
        description: |-
          ExpiresAt: 令牌过期时间（Unix 时间戳，秒）
          前端可用于自动刷新令牌
          Example: 1730466240
        example: 1730466240
        type: integer
      token_type:
        description: |-
          TokenType: 令牌类型（通常为 "Bearer"）
          使用方式: Authorization: ${token_type} ${access_token}
          Example: Bearer
        example: Bearer
        type: string
    type: object
  schema.Menu:
    properties:
      children:
        description: 子菜单列表（用于前端树形展示）
        items:
          $ref: '#/definitions/schema.Menu'
        type: array
      code:
        description: 菜单编码（同级唯一，用于权限标识）
        type: string
      created_at:
        description: 创建时间
        type: string
      description:
        description: 描述信息
        type: string
      id:
        description: 唯一 ID（主键）
        type: string
      name:
        description: 显示名称
        type: string
      parent_id:
        description: 父菜单 ID（根菜单为空）
        type: string
      parent_path:
        description: 父菜单路径（如 "root.parent"，用于快速查询祖先）
        type: string
      path:
        description: 访问路径（前端路由或 API 路径）
        type: string
      properties:
        description: '扩展属性（JSON 格式，如 {"icon": "user", "hidden": true}）'
        type: string
      resources:
        description: 关联的资源列表（API 路径+方法，用于 Casbin 权限）
        items:
          $ref: '#/definitions/schema.MenuResource'
        type: array
      sequence:
        description: 排序序号（越大越靠前）
        type: integer
      status:
        description: 状态（enabled/disabled）
        type: string
      type:
        description: 菜单类型（page/button）
        type: string
      updated_at:
        description: 更新时间
        type: string
    type: object
  schema.MenuForm:
    properties:
      code:
        description: 菜单编码（必填，同级唯一）
        maxLength: 32
        type: string
      description:
        description: 描述信息
        type: string
      name:
        description: 显示名称（必填）
        maxLength: 128
        type: string
      parent_id:
        description: 父菜单 ID
        type: string
      path:
        description: 访问路径
        type: string
      properties:
        description: 扩展属性（JSON 格式）
        type: string
      resources:
        description: 关联的资源列表
        items:
          $ref: '#/definitions/schema.MenuResource'
        type: array
      sequence:
        description: 排序序号
        type: integer
      status:
        description: 状态（必填，enabled/disabled）
        enum:
        - disabled
        - enabled
        type: string
      type:
        description: 菜单类型（必填，page/button）
        enum:
        - page
        - button
        type: string
    required:
    - code
    - name
    - status
    - type
    type: object
  schema.MenuResource:
    properties:
      created_at:
        description: 创建时间
        type: string
      id:
        description: 唯一 ID（主键）
        type: string
      menu_id:
        description: 关联的菜单 ID（外键，指向 menu.id）
        type: string
      method:
        description: HTTP 方法（如 GET, POST, PUT, DELETE）
        type: string
      path:
        description: |-
          API 请求路径（支持路径参数）
          示例: /api/v1/users, /api/v1/users/:id
        type: string
      updated_at:
        description: 更新时间
        type: string
    type: object
  schema.Notification:
    properties:
      content:
        description: 内容
        type: string
      created_at:
        description: 创建时间
        type: string
      id:
        description: 通知ID
        type: string
      is_read:
        description: 是否已读
        type: boolean
      related_id:
        description: 关联ID（如评论ID）
        type: string
      title:
        description: 标题
        type: string
      type:
        description: 通知类型
        type: string
      updated_at:
        description: 更新时间
        type: string
      user_id:
        description: 接收者ID
        type: string
    type: object
  schema.OperationLog:
    properties:
      action_type:
        description: 操作类型（如：新增、编辑、删除、审核）
        type: string
      created_at:
        description: 时间戳
        type: string
      description:
        description: 具体行为描述（如：删除了文章「标题」）
        type: string
      error_msg:
        description: 错误信息（失败时）
        type: string
      id:
        description: 主键
        type: string
      module:
        description: 操作内容分类
        type: string
      operator:
        description: 操作用户名
        type: string
      operator_id:
        description: 操作人信息
        type: string
      operator_ip:
        description: 操作者IP（支持IPv6）
        type: string
      request_method:
        description: HTTP方法
        type: string
      request_path:
        description: 请求信息
        type: string
      resource_id:
        description: 资源信息
        type: string
      resource_name:
        description: 操作的资源名称
        type: string
      status:
        description: 操作结果
        type: boolean
      status_code:
        description: HTTP状态码
        type: integer
      updated_at:
        type: string
      user_agent:
        description: 用户代理
        type: string
    type: object
  schema.Page:
    properties:
      content:
        description: Markdown内容
        type: string
      created_at:
        description: 创建时间
        type: string
      id:
        description: 页面唯一ID
        type: string
      is_published:
        description: 是否发布
        type: boolean
      slug:
        description: URL路径（如 /about）
        type: string
      title:
        description: 页面标题
        type: string
      updated_at:
        description: 更新时间
        type: string
    type: object
  schema.PageForm:
    properties:
      content:
        type: string
      is_published:
        type: boolean
      slug:
        maxLength: 255
        type: string
      title:
        maxLength: 255
        type: string
    required:
    - content
    - slug
    - title
    type: object
  schema.RegisterForm:
    properties:
      captcha_code:
        description: |-
          CaptchaCode: 验证码输入（必填）
          Example: xK9m2
        example: xK9m2
        type: string
      captcha_id:
        description: |-
          CaptchaID: 验证码 ID（必填）
          Example: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
        example: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
        type: string
      confirm_password:
        description: |-
          ConfirmPassword: 二次确认密码（必填）
          Example: MyPass123!
        example: MyPass123!
        maxLength: 64
        type: string
      email:
        description: |-
          Email: 邮箱（必填，合法格式）
          Example: user2025@example.com
        example: user2025@example.com
        maxLength: 128
        type: string
      password:
        description: |-
          Password: 登录密码（必填）
          Example: MyPass123!
        example: MyPass123!
        maxLength: 64
        type: string
      phone:
        description: |-
          Phone: 手机号（必填）
          Example: +8613900001111
        example: "+8613900001111"
        maxLength: 32
        type: string
      username:
        description: |-
          Username: 登录用户名（必填）
          Example: newuser2025
        example: newuser2025
        maxLength: 64
        type: string
    required:
    - captcha_code
    - captcha_id
    - confirm_password
    - email
    - password
    - phone
    - username
    type: object
  schema.Role:
    properties:
      code:
        description: Code of role (unique)
        type: string
      created_at:
        description: Create time
        type: string
      description:
        description: Details about role
        type: string
      id:
        description: Unique ID
        type: string
      menus:
        description: Role menu list
        items:
          $ref: '#/definitions/schema.RoleMenu'
        type: array
      name:
        description: Display name of role
        type: string
      sequence:
        description: Sequence for sorting
        type: integer
      status:
        description: Status of role (disabled, enabled)
        type: string
      updated_at:
        description: Update time
        type: string
    type: object
  schema.RoleForm:
    properties:
      code:
        description: Code of role (unique)
        maxLength: 32
        type: string
      description:
        description: Details about role
        type: string
      menus:
        description: Role menu list
        items:
