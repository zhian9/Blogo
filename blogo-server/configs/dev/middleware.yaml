# ================================
# 中间件配置
# ================================
middleware:
  # ---------------
  # 跨域资源共享（CORS）中间件
  # ---------------
  cors:
    # 是否启用 CORS
    enable: true

    # 允许的来源域名列表，生产环境必须指定具体域名
    allow_origins:
      - "${CORS_ALLOW_ORIGINS}"

    # 允许的 HTTP 方法
    allow_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "PATCH"
      - "DELETE"
      - "HEAD"
      - "OPTIONS"

    # 允许的请求头
    allow_headers:
      - "Content-Type"
      - "Authorization"
      - "X-Request-Id"
      - "X-Trace-Id"

    # 预检请求（OPTIONS）缓存时间（秒）
    max_age: 86400

    # 是否允许使用通配符
    allow_wildcard: true

    # 是否允许 WebSocket 跨域
    allow_web_sockets: true

    # 是否允许跨域访问静态文件
    allow_files: true


  # -------------------------------
  # Panic 恢复中间件（自动捕获 panic 并返回 500）
  # -------------------------------
  recovery:
    # 跳过调用栈的前 N 层（用于美化错误堆栈，通常设为 3）
    skip: 3

  # -------------------------------
  # 请求追踪中间件（用于链路追踪）
  # -------------------------------
  trace:
    # 从请求头中读取的请求 ID 字段名
    request_header_key: "X-Request-Id"

    # 响应头中返回的追踪 ID 字段名
    response_trace_key: "X-Trace-Id"

  # -------------------------------
  # 日志中间件（记录请求/响应）
  # -------------------------------
  logger:
    # 请求体最大输出长度（字节），超过则截断（防止日志过大）
    max_output_request_body_len: 4096

    # 响应体最大输出长度（字节）
    max_output_response_body_len: 4096

  # -------------------------------
  # 请求体复制中间件（用于多次读取 Body）
  # -------------------------------
  copy_body:
    # 允许复制的最大请求体大小（128MB = 128 * 1024 * 1024）
    max_content_len: 134217728

  # -------------------------------
  # JWT 认证中间件
  # -------------------------------
  auth:
    # 是否禁用认证（调试时可临时关闭）
    disable: false

    # 跳过认证的路径前缀列表（公开接口）
    skipped_path_prefixes:
      - "/api/v1/captcha"
      - "/api/v1/login"
      - "/api/v1/register"
      - "/api/v1/verify-email"
      - "/api/v1/archives"
      - "/api/v1/articles"  # 公开的列表 + 详情 + 评论
      - "/api/v1/article"   # 公开的详情（向后兼容）
      - "/api/v1/comments"  # 公开的评论创建
      - "/api/v1/subscribe" # 公开的邮件订阅/退订

    # JWT 签名算法（推荐 HS512 更安全）
    signing_method: "HS512"  # 可选：HS256 / HS384 / HS512

    # JWT 签名密钥（从环境变量读取，至少 32 字符的随机字符串）
    signing_key: "${JWT_SIGNING_KEY}"

    # 旧签名密钥（用于密钥轮换过渡期，留空表示不启用）
    old_signing_key: ""

    # Token 有效期（秒），86400 = 24 小时
    expired: 86400

    # Token 存储后端配置（用于黑名单或会话管理）
    store:
      # 存储类型：memory / badger / redis
      type: "redis"

      # 缓存 key 分隔符
      delimiter: ":"

      # 内存存储配置（仅当 type=memory 时生效）
      memory:
        # 清理过期 token 的间隔（秒）
        cleanup_interval: 60

      # BadgerDB 存储路径（仅当 type=badger 时生效）
      badger:
        path: "data/auth"

      # Redis 存储配置（仅当 type=redis 时生效）
      redis:
        # Redis 地址，若为空则复用 storage.cache.redis 配置
        addr: ""
        username: ""
        password: ""
        # 使用独立的 DB 编号（避免与缓存冲突）
        db: 2

  # -------------------------------
  # 限流中间件（Rate Limiter）
  # -------------------------------
  rate_limiter:
    # 是否启用限流
    enable: true

    # 限流统计周期（秒）
    period: 10

    # 每个 IP 在周期内允许的最大请求数
    max_requests_per_ip: 1000

    # 每个认证用户（如登录用户）在周期内允许的最大请求数
    max_requests_per_user: 500

    # 限流数据存储后端
    store:
      # 存储类型：memory / redis
      type: "memory"

      # 内存存储配置
      memory:
        # 限流记录过期时间（秒）
        expiration: 3600
        # 清理过期记录的间隔（秒）
        cleanup_interval: 60

      # Redis 存储配置
      redis:
        # 若为空，复用 storage.cache.redis 配置
        addr: ""
        username: ""
        password: ""
        # 使用独立的 DB 编号
        db: 10

  # -------------------------------
  # Casbin 权限控制中间件（RBAC）
  # -------------------------------
  casbin:
    # 是否禁用权限校验
    disable: false

    # 跳过权限检查的路径前缀（与 Auth 跳过列表一致：公开接口）
    skipped_path_prefixes:
      - "/api/v1/captcha"
      - "/api/v1/login"
      - "/api/v1/register"
      - "/api/v1/verify-email"
      - "/api/v1/current/"
      - "/api/v1/archives"
      - "/api/v1/articles"
      - "/api/v1/article"
      - "/api/v1/comments"
      - "/api/v1/subscribe"

    # 加载策略文件时使用的协程数
    load_thread: 2

    # 自动重新加载策略文件的间隔（秒）
    auto_load_interval: 3

    # Casbin 模型文件路径（定义权限规则结构）
    model_file: "rbac_model.conf"

    # 自动生成的策略文件路径（由系统写入用户角色权限）
    gen_policy_file: "gen_rbac_policy.csv"