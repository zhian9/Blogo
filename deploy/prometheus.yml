# Blogo — Prometheus Docker 容器化配置
# 此文件由 docker-compose.yml 挂载到 Prometheus 容器内

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: production
    app: blogo

scrape_configs:
  - job_name: blogo-backend
    metrics_path: /metrics
    basic_auth:
      username: admin
      password: admin
    static_configs:
      - targets:
          - blogo:8040
        labels:
          service: go-admin
          version: v1.0.0

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
