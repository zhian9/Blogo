# ═══════════════════════════════════════════════════════
# Blogo — 全栈 Docker Compose
# ═══════════════════════════════════════════════════════
# 用法:
#   docker network create blogo-net
#   docker-compose -f deploy/compose/full-stack.yml up -d
# ═══════════════════════════════════════════════════════

version: "3.8"

services:
  # ── Go 后端 ────────────────────────────────────────
  blogo:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: blogo:latest
    container_name: blogo
    restart: unless-stopped
    env_file:
      - ../../blogo-server/.env
    volumes:
      - blogo_uploads:/app/storage/uploads
    ports:
      - "8040:8040"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - blogo-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── MySQL ───────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: blogo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: go_admin
      MYSQL_USER: blogo
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-blogo123}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - blogo-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── Redis ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: blogo-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - blogo-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── Nginx ───────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: blogo-nginx
    restart: unless-stopped
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - blogo-net
    depends_on:
      - blogo
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  blogo_uploads:
  mysql_data:
  redis_data:

networks:
  blogo-net:
    external: true
    name: blogo-net
