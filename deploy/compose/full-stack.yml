# Blogo — 全栈 Docker Compose
# 用法: docker-compose -f deploy/compose/full-stack.yml up -d
#
# 服务:
#   blogo-server  — Go 后端 API (:8040)
#   blogo-mysql   — MySQL 8.0 (:3306)
#   blogo-redis   — Redis 7 (:6379)
#   blogo-nginx   — 反向代理 (:80/:443)
#
# 前置条件:
#   1. 创建 blogo-net 网络: docker network create blogo-net
#   2. 配置 blogo-server/.env 环境变量
#   3. 构建镜像: docker build -t blogo-server:latest -f deploy/docker/Dockerfile blogo-server

version: "3.8"

services:
  # ── Go 后端 ──────────────────────────────────────
  blogo-server:
    image: blogo-server:latest
    container_name: blogo-server
    restart: unless-stopped
    env_file:
      - ../blogo-server/.env
    volumes:
      - ../../logs:/logs
    ports:
      - "8040:8040"
    depends_on:
      blogo-mysql:
        condition: service_healthy
      blogo-redis:
        condition: service_healthy
    networks:
      - blogo-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── MySQL ─────────────────────────────────────────
  blogo-mysql:
    image: mysql:8.0
    container_name: blogo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: go_admin
      MYSQL_USER: blogo
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-blogo123}
    volumes:
      - mysql_data:/var/lib/mysql
    volumes:
      - ../../logs:/logs
    ports:
      - "3306:3306"
    networks:
      - blogo-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Redis ─────────────────────────────────────────
  blogo-redis:
    image: redis:7-alpine
    container_name: blogo-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --appendonly yes
    volumes:
      - redis_data:/data
    volumes:
      - ../../logs:/logs
    ports:
      - "6379:6379"
    networks:
      - blogo-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Nginx 反向代理 ──────────────────────────────
  blogo-nginx:
    image: nginx:alpine
    container_name: blogo-nginx
    restart: unless-stopped
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
    volumes:
      - ../../logs:/logs
    ports:
      - "80:80"
      - "443:443"
    networks:
      - blogo-net
    depends_on:
      - blogo-server
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
  redis_data:

networks:
  blogo-net:
    external: true
    name: blogo-net
