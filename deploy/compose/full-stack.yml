# ═══════════════════════════════════════════════════════════
# Blogo — 生产级 Docker Compose
# ═══════════════════════════════════════════════════════════
# 用法:
#   docker network create blogo-net
#   docker-compose -f deploy/compose/full-stack.yml up -d
#   docker-compose -f deploy/compose/full-stack.yml logs -f
# ═══════════════════════════════════════════════════════════

version: "3.8"

services:

  # ── Go API 服务 ─────────────────────────────────────
  blogo-api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.nobuild
    image: blogo:latest
    container_name: blogo-api
    restart: unless-stopped
    env_file:
      - ../../blogo-server/.env
    volumes:
      - blogo_uploads:/app/storage/uploads
      - ../../configs/server:/app/configs
    ports:
      - "8040:8040"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - blogo-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8040/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"

  # ── MySQL 8.0 ───────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: blogo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:       ${MYSQL_DATABASE:-blogo}
      MYSQL_USER:           ${MYSQL_USER:-blogo}
      MYSQL_PASSWORD:       ${MYSQL_PASSWORD}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    # 不暴露公网端口（仅容器内通信）
    # ports:
    #   - "3306:3306"
    networks:
      - blogo-net
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"

  # ── Redis 7 ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: blogo-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    # 不暴露公网端口（仅容器内通信）
    # ports:
    #   - "6379:6379"
    networks:
      - blogo-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"

  # ── Nginx 反向代理 ──────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: blogo-nginx
    restart: unless-stopped
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - ../../blogo-web/dist:/usr/share/nginx/html/blogo-web:ro
      - ../../blogo-admin/dist:/usr/share/nginx/html/blogo-admin:ro
    ports:
      - "80:80"
      - "81:81"
    networks:
      - blogo-net
    depends_on:
      - blogo-api
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"

# ═══════════════════════════════════════════════════════
# 持久化卷
# ═══════════════════════════════════════════════════════
volumes:
  blogo_uploads:
  mysql_data:
  redis_data:

# ═══════════════════════════════════════════════════════
# 网络
# ═══════════════════════════════════════════════════════
networks:
  blogo-net:
    external: true
    name: blogo-net
