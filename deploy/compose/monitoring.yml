# Blogo — 监控栈 Docker Compose
# 用法：docker-compose -f deployment/monitoring/docker-compose.yml up -d
#
# 服务说明：
#   prometheus   — 指标采集与存储（:9090）
#   grafana      — 可视化仪表盘（:3000，默认 admin/admin）
#
# Go 后端 blogo-backend 应在主 docker-compose.yml 中定义，
# 确保与监控栈处于同一 Docker 网络（默认 blogo-net）。若网络名不同，请修改下方 networks 配置。

version: "3.8"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: blogo-prometheus
    restart: unless-stopped
    volumes:
      - ../prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    networks:
      - blogo-net

  grafana:
    image: grafana/grafana:latest
    container_name: blogo-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    networks:
      - blogo-net
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:

networks:
  blogo-net:
    external: true
    name: blogo-net
