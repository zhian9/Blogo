# Blogo — Nginx 站点配置

upstream blogo_backend {
    server blogo-server:8040;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 健康检查
    location /health {
        proxy_pass http://blogo_backend;
        access_log off;
    }

    # API 代理
    location /api/ {
        proxy_pass http://blogo_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Swagger 文档
    location /docs/ {
        proxy_pass http://blogo_backend;
    }

    location /swagger/ {
        proxy_pass http://blogo_backend;
    }

    # 静态文件（上传目录）
    location /uploads/ {
        proxy_pass http://blogo_backend;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Metrics（Basic Auth 在应用层处理）
    location /metrics {
        proxy_pass http://blogo_backend;
        access_log off;
    }
}
