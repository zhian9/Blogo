# ═══════════════════════════════════════════════════════════
# 前台 — blogo.cloud / www.blogo.cloud
# ═══════════════════════════════════════════════════════════

# HTTP → 域名访问跳转 HTTPS，IP 访问直接走这里
server {
    listen 80 default_server;
    server_name blogo.cloud www.blogo.cloud;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header    CF-Connecting-IP;
    real_ip_recursive on;

    root /usr/share/nginx/html/blogo-web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://blogo_backend;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade          $http_upgrade;
        proxy_set_header    Connection       "upgrade";
        proxy_set_header    Host             $host;
        proxy_set_header    X-Real-IP        $remote_addr;
        proxy_set_header    X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_pass_header   Authorization;
        proxy_set_header    Authorization    $http_authorization;
        proxy_read_timeout      60s;
        proxy_connect_timeout   10s;
    }

    location /docs/  { proxy_pass http://blogo_backend; }
    location /swagger/ { proxy_pass http://blogo_backend; }

    location /metrics {
        proxy_pass http://blogo_backend;
        access_log off;
    }

    location /uploads/ {
        proxy_pass http://blogo_backend;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# HTTPS ← Cloudflare Full SSL 连接这里
server {
    listen 443 ssl;
    server_name blogo.cloud www.blogo.cloud;

    ssl_certificate     /etc/nginx/certs/blogo.cloud.crt;
    ssl_certificate_key /etc/nginx/certs/blogo.cloud.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
