# ═══════════════════════════════════════════════════════════
# Blogo — 站点配置 (HTTP)
# Cloudflare → Nginx → blogo-api
# ═══════════════════════════════════════════════════════════

# ── 速率限制映射 ────────────────────────────────────
# 根据请求路径映射不同限流区域
map $request_uri $rate_limit_key {
    default              "";
    "~^/api/v1/login"    "login";    # 登录走低频限流
}

# ── HTTP 服务器 ─────────────────────────────────────
server {
    listen 80;
    server_name _;

    # ── Cloudflare 真实 IP 还原 ─────────────────────
    # 仅信任 Cloudflare IP 段（完整列表）
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header    CF-Connecting-IP;
    real_ip_recursive on;

    # ── 连接限制 ────────────────────────────────────
    limit_conn conn_limit 20;
    limit_conn_status 429;

    # ── 健康检查（不限流）───────────────────────────
    location /health {
        proxy_pass http://blogo_backend;
        access_log off;
        limit_req  zone=api_limit burst=50 nodelay;
        limit_conn conn_limit 20;
    }

    # ── API 端点 ────────────────────────────────────
    location /api/ {
        # 限流: 通用 API
        limit_req  zone=api_limit burst=50 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://blogo_backend;

        # WebSocket 支持
        proxy_http_version  1.1;
        proxy_set_header    Upgrade          $http_upgrade;
        proxy_set_header    Connection       "upgrade";

        # 透传 Header
        proxy_set_header    Host             $host;
        proxy_set_header    X-Real-IP        $remote_addr;
        proxy_set_header    X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    X-Request-Id     $request_id;

        # JWT / Authorization 透传
        proxy_pass_header   Authorization;
        proxy_set_header    Authorization    $http_authorization;

        # 超时 & 缓冲
        proxy_read_timeout      60s;
        proxy_connect_timeout   10s;
        proxy_send_timeout      60s;
        proxy_buffer_size       16k;
        proxy_buffers           8 16k;
        proxy_busy_buffers_size 32k;

        # 后端不可用时返回友好错误
        proxy_intercept_errors on;
        error_page 502 503 504 /50x.html;
    }

    # ── 登录端点（低频限流）─────────────────────────
    location /api/v1/login {
        limit_req  zone=login_limit burst=3 nodelay;
        limit_conn conn_limit 5;

        proxy_pass http://blogo_backend;

        proxy_http_version  1.1;
        proxy_set_header    Upgrade          $http_upgrade;
        proxy_set_header    Connection       "upgrade";
        proxy_set_header    Host             $host;
        proxy_set_header    X-Real-IP        $remote_addr;
        proxy_set_header    X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    X-Request-Id     $request_id;
        proxy_set_header    Authorization    $http_authorization;

        proxy_read_timeout    30s;
        proxy_connect_timeout 5s;
    }

    # ── Swagger 文档 ────────────────────────────────
    location /docs/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://blogo_backend;
        proxy_set_header Host $host;
    }

    location /swagger/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://blogo_backend;
        proxy_set_header Host $host;
    }

    # ── Prometheus 指标 ─────────────────────────────
    location /metrics {
        limit_req zone=api_limit burst=5 nodelay;
        proxy_pass http://blogo_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── 上传文件（长缓存）───────────────────────────
    location /uploads/ {
        expires 30d;
        add_header Cache-Control "public, immutable";

        proxy_pass http://blogo_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 上传文件不做缓冲（节省内存）
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 50m;
    }

    # ── 拒绝隐藏文件 / 敏感路径 ─────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(git|svn|hg|bzr|cvs) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 拒绝常见的恶意扫描路径
    location ~* (wp-admin|wp-login|phpmyadmin|\.php$|\.asp$|\.aspx$) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── 自定义 502/503/504 页面 ─────────────────────
    location /50x.html {
        internal;
        default_type text/plain;
        return 503 '{"error":"Service temporarily unavailable"}';
    }

    # ── 默认拒绝 ────────────────────────────────────
    location / {
        return 404;
    }
}
