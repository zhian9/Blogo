# ═══════════════════════════════════════════════════════════
# 监控查询 — prometheus.blogo.cloud
# ═══════════════════════════════════════════════════════════

# HTTP
server {
    listen 80;
    server_name prometheus.blogo.cloud;

    location / {
        auth_basic           "Prometheus";
        auth_basic_user_file /etc/nginx/htpasswd/prometheus;
        proxy_pass http://blogo-prometheus:9090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS ← Cloudflare Full SSL 连接这里
server {
    listen 443 ssl;
    server_name prometheus.blogo.cloud;

    ssl_certificate     /etc/nginx/certs/blogo.cloud.crt;
    ssl_certificate_key /etc/nginx/certs/blogo.cloud.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        auth_basic           "Prometheus";
        auth_basic_user_file /etc/nginx/htpasswd/prometheus;
        proxy_pass http://blogo-prometheus:9090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
