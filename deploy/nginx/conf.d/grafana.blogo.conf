# ═══════════════════════════════════════════════════════════
# 监控看板 — grafana.blogo.cloud
# ═══════════════════════════════════════════════════════════

# HTTP
server {
    listen 80;
    server_name grafana.blogo.cloud;

    location / {
        proxy_pass http://blogo-grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 支持（Grafana 实时刷新依赖）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
    }
}

# HTTPS ← Cloudflare Full SSL 连接这里
server {
    listen 443 ssl;
    server_name grafana.blogo.cloud;

    ssl_certificate     /etc/nginx/certs/blogo.cloud.crt;
    ssl_certificate_key /etc/nginx/certs/blogo.cloud.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://blogo-grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # WebSocket 支持
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
    }
}
