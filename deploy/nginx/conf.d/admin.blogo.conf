# ═══════════════════════════════════════════════════════════
# 后台 — admin.blogo.cloud
# ═══════════════════════════════════════════════════════════

# HTTP / IP 81 端口
server {
    listen 81;
    listen 80;
    server_name admin.blogo.cloud;

    root /usr/share/nginx/html/blogo-admin;
    index index.html;

    location / { try_files $uri $uri/ /index.html; }

    location /api/ {
        proxy_pass http://blogo_backend;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade          $http_upgrade;
        proxy_set_header    Connection       "upgrade";
        proxy_set_header    Host             $host;
        proxy_set_header    X-Real-IP        $remote_addr;
        proxy_set_header    X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_pass_header   Authorization;
        proxy_set_header    Authorization    $http_authorization;
        proxy_read_timeout      60s;
        proxy_connect_timeout   10s;
    }

    location /docs/  { proxy_pass http://blogo_backend; }
    location /swagger/ { proxy_pass http://blogo_backend; }

    location /metrics {
        proxy_pass http://blogo_backend;
        access_log off;
    }

    location /uploads/ {
        proxy_pass http://blogo_backend;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# HTTPS ← Cloudflare Full SSL
server {
    listen 443 ssl;
    server_name admin.blogo.cloud;

    ssl_certificate     /etc/nginx/certs/blogo.cloud.crt;
    ssl_certificate_key /etc/nginx/certs/blogo.cloud.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html/blogo-admin;
    index index.html;

    location / { try_files $uri $uri/ /index.html; }

    location /api/ {
        proxy_pass http://blogo_backend;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade          $http_upgrade;
        proxy_set_header    Connection       "upgrade";
        proxy_set_header    Host             $host;
        proxy_set_header    X-Real-IP        $remote_addr;
        proxy_set_header    X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_pass_header   Authorization;
        proxy_set_header    Authorization    $http_authorization;
        proxy_read_timeout      60s;
        proxy_connect_timeout   10s;
    }

    location /docs/  { proxy_pass http://blogo_backend; }
    location /swagger/ { proxy_pass http://blogo_backend; }

    location /metrics {
        proxy_pass http://blogo_backend;
        access_log off;
    }

    location /uploads/ {
        proxy_pass http://blogo_backend;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
