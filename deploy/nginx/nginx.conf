# ═══════════════════════════════════════════════════════════
# Blogo — Nginx 生产级主配置
# Debian 12.2 / Docker / Cloudflare
# ═══════════════════════════════════════════════════════════

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

pid  /var/run/nginx.pid;

error_log  /var/log/nginx/error.log warn;

events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── 隐藏版本号 ──────────────────────────────────
    server_tokens off;

    # ── 日志格式（含 Cloudflare 透传字段）────────────
    log_format main escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"cf_connecting_ip":"$http_cf_connecting_ip",'
        '"cf_ray":"$http_cf_ray",'
        '"cf_country":"$http_cf_ipcountry",'
        '"host":"$host",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"ua":"$http_user_agent",'
        '"x_forwarded_for":"$http_x_forwarded_for",'
        '"x_forwarded_proto":"$http_x_forwarded_proto",'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":$upstream_status,'
        '"upstream_time":$upstream_response_time'
        '}';

    access_log  /var/log/nginx/access.log main buffer=64k flush=5s;
    error_log   /var/log/nginx/error.log  warn;

    # ── 基础优化 ────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  100;
    types_hash_max_size 2048;

    # ── 安全限制 ────────────────────────────────────
    client_body_buffer_size     128k;
    client_max_body_size        50m;          # 上传限制
    client_header_buffer_size   4k;
    large_client_header_buffers 4 16k;
    client_body_timeout         60s;
    client_header_timeout       60s;
    send_timeout                60s;

    # 防止大文件攻击
    limit_rate_after 5m;
    limit_rate       1m;

    # ── Gzip 压缩 ────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        text/markdown
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-javascript
        application/atom+xml
        application/rss+xml
        application/font-woff
        application/font-woff2
        image/svg+xml
        image/x-icon
        font/ttf
        font/woff
        font/woff2;

    # ── 安全 Header（全局默认）──────────────────────
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "DENY"             always;
    add_header X-XSS-Protection          "1; mode=block"    always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # ── 限流区域 ────────────────────────────────────
    # API 限流: 每 IP 每秒 30 请求, 突发 50
    limit_req_zone  $binary_remote_addr  zone=api_limit:10m   rate=30r/s;
    # 登录限流: 每 IP 每分钟 5 次
    limit_req_zone  $binary_remote_addr  zone=login_limit:10m  rate=5r/m;
    # 并发连接限制: 每 IP 最多 20 连接
    limit_conn_zone $binary_remote_addr  zone=conn_limit:10m;

    # ── 上游后端 ────────────────────────────────────
    upstream blogo_backend {
        server blogo-api:8040 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    # ── 站点配置 ────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
